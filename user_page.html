<!DOCTYPE html>
<html>

    <head>
        <title>Contact Form</title>
    </head>
    <link rel="stylesheet" href="style1.css">
    <script src="login_script.js"></script>
    
    <body onload="loadUserData()">
        <div class="img">
            <h1 class="heading">Fitness Website</h1>
            <div class="nav_bar">
            <a href="index.html" target="_parent"><button class="nav_btn" ><img src="icons/home.png" width="17px"> Home</button></a>
            <a href="services.html" target="_parent"><button class="nav_btn"><img src="icons/services.png" width="17px"> Services</button></a>
            <a href="founders.html" target="_parent"><button class="nav_btn"><img src="icons/founder.png" width="17px"> Founders</button></a>
            <a href="contact_form.html" target="_parent"><button class="nav_btn"><img src="icons/contact.png" width="17px"> Contact Us</button></a>
        </div>
        </div>
        <br><br><br>
        <div class="services">
            <h1 id="user_name">Welcome Back, </h1><br><br>
            <div class="cbox">
                <h2>Calorie Calculator</h2>

                <form id="calorieForm">
                    <input type="number" id="age" placeholder="Age" required>
                    <input type="number" id="weight" placeholder="Weight (kg)" required>
                    <input type="number" id="height" placeholder="Height (cm)" required>

                    <select id="gender" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>

                    <select id="activity" required>
                        <option value="" disabled selected>Activity Level</option>
                        <option value="1.2">Sedentary (little/no exercise)</option>
                        <option value="1.375">Lightly active (1–3 days/week)</option>
                        <option value="1.55">Moderately active (3–5 days/week)</option>
                        <option value="1.725">Very active (6–7 days/week)</option>
                        <option value="1.9">Super active (physical job + training)</option>
                    </select>

                    <button class="form_btn" type="button" onclick="calculateCalories()">Calculate</button>
                </form>

                <div id="result" style="margin-top:20px; text-align:center; font-size:18px;"></div>
            </div>
            <br><br>
            <h2 class="ut">Select a Meal to Add</h2>
                <select id="mealName" required>
                    <option disabled selected>Select a Meal</option>
                </select>


                <button class="form_btn" onclick="addMealPrep()">Add Meal</button>


            <div class="section">
                <h2 class="section-title">Your Meals</h2>
                <div id="obju"></div>
            </div>



            <hr class="divider">
            <h2 class="ut">Select an Exercise to Add</h2>


                <select id="exerciseName" required>
                    <option disabled selected>Select an Excersie</option>
                </select>

                <button class="form_btn" onclick="addexercisePrep()">Add Meal</button>

            <div class="section">
                <h2 class="section-title">Your Exercises</h2>
                <div id="obju2"></div>
            </div>
        </div>
    </div>
    
    <footer>
    <div class="footer">
        @2025 Rights Reserved to Hamza
    </div>
    </footer>

</body>
</html>
