<!DOCTYPE html>
<html>

    <head>
        <title>Contact Form</title>
    </head>
    <link rel="stylesheet" href="style1.css">
    <body>
        <div class="img">
            <h1 class="heading"><img src="images/fitness.png" size="25px"> FitLifeHub.com </h1>
            <div class="nav_bar">
            <a href="index.html" target="_parent"><button class="nav_btn" ><img src="icons/home.png" width="17px"> Home</button></a>
            <a href="services.html" target="_parent"><button class="nav_btn"><img src="icons/services.png" width="17px"> Services</button></a>
            <a href="founders.html" target="_parent"><button class="nav_btn"><img src="icons/founder.png" width="17px"> Founders</button></a>

        </div>
        </div>
        <br><br><br>
        <div class="main">
            <div class="left">
                <img src="icons/operator.png" width="100px">
                <h1 class="title"><b>Contact</b> <span class="title_span"><b>Us</b></span></h1> 
            </div>
            <form>
                <div class="right">
                    <input type="text" class="name" placeholder="Name" required size="30">
                    <input type="email" class="email" placeholder="Email" required>
                    <input type="text" class="subject" placeholder="Subject" required>
                    <textarea class="message" placeholder="Message..." rows="5"></textarea>
                    <button type="submit" class="form_btn" onclick="alert('Thank You! Your Message has been sent.')">Send</button>

                </div>
            </form>
        </div>
