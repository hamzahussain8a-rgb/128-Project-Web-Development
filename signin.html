<!DOCTYPE html>
<html>

    <head>
        <title>Contact Form</title>
    </head>
    <link rel="stylesheet" href="style1.css">
    <script src="signin.js"></script>
    <body>
        <div class="img">
            <h1 class="heading"><img src="images/fitness.png" size="25px"> FitLifeHub.com </h1>
            <div class="nav_bar">
            <a href="index.html" target="_parent"><button class="nav_btn" ><img src="icons/home.png" width="17px"> Home</button></a>
            <a href="services.html" target="_parent"><button class="nav_btn"><img src="icons/services.png" width="17px"> Services</button></a>
            <a href="founders.html" target="_parent"><button class="nav_btn"><img src="icons/founder.png" width="17px"> Founders</button></a>
            <a href="contact_form.html" target="_parent"><button class="nav_btn"><img src="icons/contact.png" width="17px"> Contact Us</button></a>
        </div>
        </div>
        <br><br><br>
        <div class="main">
            <div class="left">
                <img src="icons/register.png" width="150px">
                
            </div>
            <form id="signupForm">
                <div class="right">
                    <h1 class="title"><b>Regis</b><span class="title_span2"><b>ter</b></span></h1> 
                    <input type="text" id="uname" placeholder="Username" required size="30">
                    <input type="password" id="pass" placeholder="Password" required>
                    <select id="membership" required>
                        <option disabled selected>Select Membership</option>
                        <option>Standard</option>
                        <option>Gold</option>
                        <option>Diamond</option>
                    </select>
                    <button type="button" class="form_btn" onclick="addUser(document.getElementById('uname').value, document.getElementById('pass').value, document.getElementById('membership').value);">Sign Up</button>
                </div>
            </form>

        </div>
        <footer>
            <div class="footer">
                @2025 Rights Reserved to Hamza
            </div>
        </footer>
    </body>
</html>
